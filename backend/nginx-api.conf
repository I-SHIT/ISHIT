# ISHIT 后端 HTTPS 反代配置 (Nginx / 宝塔 / 1Panel)
server {
    listen 80;
    server_name api.ishit.pw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ishit.pw;

    # 证书路径（若使用宝塔/1Panel/Certbot 请替换为实际生成的证书路径）
    ssl_certificate     /etc/letsencrypt/live/api.ishit.pw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ishit.pw/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
